name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Every other run gets
  # a group of its own: GitHub replaces a pending run in the same group, and
  # every commit on main keeps its own verdict.
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the validation tools
        run: scripts/install-validate-tools.sh

      - name: Check out upstream at the pin
        run: make vendor

      - name: Validate
        run: make validate

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the validation tools
        run: scripts/install-validate-tools.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Show the versions of the tools of the runner
        run: |
          yq --version
          jq --version
          git --version
          bats --version

      # tests/unit/crd-sources.bats reads the source of K-ORC of upstream, and
      # tests/unit/modules.bats compares the copies of compute/ with
      # upstream's files.
      - name: Check out upstream at the pin
        run: make vendor

      - name: Run the unit tests
        run: make test

      - name: Run the tests of the validation
        run: make test-validate
