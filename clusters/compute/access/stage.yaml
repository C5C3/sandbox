apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-access
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  # The objects of the module land on sandbox-management, where Flux runs:
  # the HelmRelease reaches sandbox-compute through spec.kubeConfig of its
  # own, so the stage names none.
  path: ./compute/access
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  # kstatus reads no Ready condition of a HelmRelease or an
  # ArtifactGenerator.
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
    - apiVersion: source.extensions.fluxcd.io/v1beta1
      kind: ArtifactGenerator
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
