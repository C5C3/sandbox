apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-libvirt
  namespace: flux-system
spec:
  # access creates the namespace openstack, controllers runs cert-manager,
  # node-prep creates hypervisor-system and labels the nodes.
  dependsOn:
    - name: compute-access
    - name: compute-controllers
    - name: compute-node-prep
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./compute/libvirt
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  kubeConfig:
    secretRef:
      name: kubeconfig-compute
  # No postBuild: the scripts of the ConfigMap hold ${...} of bash, which a
  # substitution would empty.
  healthCheckExprs:
    # libvirtd starts once kvm-node-agent has written the TLS files, which
    # needs the Hypervisor and the certificate of the hypervisor operator.
    # The stage waits for the CA and the Issuer, not for the pods.
    - apiVersion: apps/v1
      kind: DaemonSet
      current: status.observedGeneration == metadata.generation
