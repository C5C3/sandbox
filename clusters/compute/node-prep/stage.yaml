apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-node-prep
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./compute/node-prep
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  kubeConfig:
    secretRef:
      name: kubeconfig-compute
