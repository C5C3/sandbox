# The module cinder-backup gives Cinder the RBD backup target cephbk on the
# pool backups of the Ceph of sandbox-storage, and has no stage of its own.
# It appends the Component components/cinder-backup to the stage of the
# module controlplane. It adds no dependency: the one cinder-rbd adds,
# management-ceph-keys, covers ceph-client-cinder-backup, which the same
# stage writes. The module needs cinder and cinder-rbd beside it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: management-controlplane
    patch: |
      - op: add
        path: /spec/components/-
        value: components/cinder-backup
