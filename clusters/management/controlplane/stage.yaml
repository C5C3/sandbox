apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-controlplane
  namespace: flux-system
spec:
  dependsOn:
    - name: management-platform
    - name: management-gateway
    - name: management-sizing
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./controlplane
  # One Component per service. The patches Components of other modules
  # append theirs: components/glance, placement, barbican, neutron, cinder,
  # nova and horizon from the service modules of the same names, glance
  # with the dependency on objectstore, components/messaging-tls with the
  # dependency on the stage of its module, components/orders, the namespace
  # assignments, without one, and components/remote-compute, the remote
  # compute contract of Nova.
  components:
    - components/keystone
  # The patches Components of other modules append to this list, and Flux
  # applies it after every Component: the backend module cinder-nfs appends
  # its volume backend to the backends of components/cinder, with the
  # dependency on the stage that serves it, and the module remote-compute
  # publishes the databases of the OVNCentral controlplane-ovn.
  patches: []
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  # kstatus waits for the Job to complete but reads no Ready condition of a
  # ControlPlane.
  healthCheckExprs:
    - apiVersion: c5c3.io/v1alpha1
      kind: ControlPlane
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
