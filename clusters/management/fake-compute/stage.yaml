apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-fake-compute
  namespace: flux-system
spec:
  dependsOn:
    - name: management-controlplane
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./controlplane/fake-compute
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
