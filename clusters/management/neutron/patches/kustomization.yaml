# The module neutron runs the Network service on OVN and has no stage of its
# own. It appends the Component components/neutron, which also holds the
# OVNCentral controlplane-ovn, to the stage of the module controlplane, and
# resumes the ovn-operator and then the neutron-operator, which controllers
# suspends, on one replica each: the release of the neutron-operator depends
# on that of the ovn-operator. Without the module controlplane the first
# patch changes nothing, while the second still resumes both operators: the
# ovn-operator runs, and the neutron-operator then waits for the
# keystone-operator that only controlplane resumes, so the module belongs
# beside controlplane.
#
# The Flux patch tests that controllers suspended each release before it
# resumes it: replace alone would add the field, so a render with every
# service module would not need the suspension, and make validate would
# report that patch of infrastructure/controllers as dead.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: management-controlplane
    patch: |
      - op: add
        path: /spec/components/-
        value: components/neutron
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: management-controllers
    patch: |
      - op: add
        path: /spec/patches/-
        value:
          target:
            group: helm.toolkit.fluxcd.io
            kind: HelmRelease
            name: ovn-operator
            namespace: ovn-system
          patch: |
            - op: test
              path: /spec/suspend
              value: true
            - op: replace
              path: /spec/suspend
              value: false
            - op: replace
              path: /spec/values/replicas
              value: 1
      - op: add
        path: /spec/patches/-
        value:
          target:
            group: helm.toolkit.fluxcd.io
            kind: HelmRelease
            name: neutron-operator
            namespace: neutron-system
          patch: |
            - op: test
              path: /spec/suspend
              value: true
            - op: replace
              path: /spec/suspend
              value: false
            - op: replace
              path: /spec/values/replicas
              value: 1
