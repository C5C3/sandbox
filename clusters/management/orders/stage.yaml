apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-orders
  namespace: flux-system
spec:
  dependsOn:
    - name: management-controlplane
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./orders
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  # kstatus reads no Ready condition of an order. A bus without clusterRef
  # serves no vhost orders, and a RabbitMQVhost there reports VhostReady
  # False with MessagingNotManaged, or MessagingNotDeclared without a
  # messaging block, for good (ADR-0010); the stage counts that as settled.
  healthCheckExprs:
    - apiVersion: c5c3.io/v1alpha1
      kind: KeystoneUser
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: KeystoneProject
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: KeystoneRoleAssignment
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: KeystoneCatalogEntry
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: KeystoneApplicationCredential
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: MariaDBDatabase
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: c5c3.io/v1alpha1
      kind: RabbitMQVhost
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') || status.conditions.exists(c, c.type == 'VhostReady' && (c.reason == 'MessagingNotManaged' || c.reason == 'MessagingNotDeclared'))
