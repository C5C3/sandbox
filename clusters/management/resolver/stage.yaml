apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-resolver
  namespace: flux-system
spec:
  dependsOn:
    - name: management-loadbalancer
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./infrastructure/resolver/management
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
