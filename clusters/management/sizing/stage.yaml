apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-sizing
  namespace: flux-system
spec:
  dependsOn:
    - name: management-platform
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./platform/sizing
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
