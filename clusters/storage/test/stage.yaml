apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-test
  namespace: flux-system
spec:
  dependsOn:
    - name: management-test
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./infrastructure/test
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: sandbox
  kubeConfig:
    secretRef:
      name: kubeconfig-storage
  postBuild:
    substitute:
      CLUSTER: storage
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
