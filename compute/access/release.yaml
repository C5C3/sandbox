# The release name and the namespace are those of upstream's guide Deploy to
# a Target Cluster, so the token Secret is
# c5c3-access/target-cluster-access-token. The release history stays on
# sandbox-compute: storageNamespace defaults to the namespace of the
# HelmRelease, and the compute cluster has no flux-system. The values give
# the operators the namespace openstack, privileged for the chassis and the
# pool, and create it; Helm keeps it when the release is removed. Helm
# installs the seven order CRDs of the chart's crds/ with the first install.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: compute-access
  namespace: flux-system
spec:
  interval: 10m
  releaseName: target-cluster-access
  targetNamespace: c5c3-access
  storageNamespace: c5c3-access
  install:
    createNamespace: true
  chartRef:
    kind: ExternalArtifact
    name: target-cluster-access
  kubeConfig:
    secretRef:
      name: kubeconfig-compute
  values:
    namespaces: [openstack]
    privilegedNamespaces: [openstack]
    createNamespaces: true
