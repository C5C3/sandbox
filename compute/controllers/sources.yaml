# The URLs of vendor/cobaltcore/deploy/bases/operators/sources/cert-manager.yaml
# and external-secrets.yaml. The role in each name keeps them apart from the
# sources of management-controllers and of the module controllers of the
# storage cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: compute-cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: compute-external-secrets
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.external-secrets.io
