# Every scalar key also reaches the stages as a Flux variable through
# cluster_vars in scripts/lib/hub.sh, so this file never holds a credential.
network:
  # Read by scripts/up.sh: the subnet of the Docker network cobaltcore-sandbox.
  subnet: 172.30.0.0/16
addresses:
  # Read by the resolver check of scripts/lib/preflight.sh, and by the module gateway: the address of the Gateway openstack-gw.
  gateway: 172.30.255.10
  # Read by the module loadbalancer: the address pool of MetalLB, inside network.subnet.
  pool: 172.30.255.0/24
  # Read by the module resolver on sandbox-management: the address of the resolver fallback, inside addresses.pool.
  dns: 172.30.255.53
  # Read by the module messaging-tls: the address of the AMQPS listener of the message bus, inside addresses.pool.
  rabbitmq: 172.30.255.11
registry:
  # Read by scripts/up.sh: the image of the container sandbox-registry.
  image: registry:3
switches:
  # Read by kind_config in scripts/lib/common.sh: the worker nodes of sandbox-compute.
  hypervisor-nodes: 1
  # Read by cluster_modules in scripts/lib/profile.sh: true adds the module resolver to every cluster.
  resolver-fallback: false
  # Read by cluster_modules in scripts/lib/profile.sh: true adds the module glance to sandbox-management.
  glance: false
  # Read by cluster_modules in scripts/lib/profile.sh: true adds the module barbican to sandbox-management.
  barbican: false
  # Read by cluster_modules in scripts/lib/profile.sh: true adds the module horizon to sandbox-management.
  horizon: false
  # Read by cluster_modules in scripts/lib/profile.sh: true adds the module fake-compute to sandbox-management.
  fake-compute: false
  # Read by ensure_block_devices in scripts/lib/storage.sh and by the module ceph-cluster: the OSDs of sandbox-storage.
  osd-count: 1
  # Read by ensure_block_devices in scripts/lib/storage.sh and by the module ceph-cluster: the size of the sparse file of each OSD, a whole number of Gi.
  osd-size: 10Gi
upstream:
  # Read by config_load in scripts/lib/common.sh: the commit of C5C3/cobaltcore that make vendor checks out. scripts/pin.sh moves it.
  cobaltcore: 15a0323e243c7f53b91200f193a58b5b41d41f6a
flux:
  # Read by ensure_flux in scripts/lib/hub.sh: the version of the chart flux-operator.
  operator: 0.63.1
