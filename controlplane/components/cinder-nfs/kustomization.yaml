# The volume backend nfs1 of Cinder on the export /volumes of the NFS server
# of the module cinder-nfs. The entry is that of the block-storage fragment of
# Step 4 of upstream's Quick Start (ControlPlane) at the pin, as
# vendor/cobaltcore/deploy/overlays/metal-stack/controlplane-nfs/kustomization.yaml
# adds it, without the backup target nfsbk. A merge patch replaces the list,
# so this is the only Component that sets backends.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: c5c3.io
      version: v1alpha1
      kind: ControlPlane
      name: controlplane
      namespace: openstack
    patch: |
      apiVersion: c5c3.io/v1alpha1
      kind: ControlPlane
      metadata:
        name: controlplane
        namespace: openstack
      spec:
        services:
          cinder:
            backends:
              - name: nfs1
                type: NFS
                nfs:
                  server: nfs-server.openstack.svc.cluster.local
                  path: /volumes
