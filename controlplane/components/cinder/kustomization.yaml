# Cinder behind the Gateway openstack-gw at cinder.<a-b-c-d>.nip.io. The
# block is that of Step 4 of upstream's Quick Start (ControlPlane) at the pin
# with an empty list of backends and without backupBackend: a backend module
# such as cinder-nfs or cinder-rbd appends its entry with a Flux patch of the
# stage of the module controlplane, which runs after every Component, and the
# API server refuses a ControlPlane whose backends is empty (minItems 1 in
# vendor/cobaltcore/operators/c5c3/config/crd/bases/c5c3.io_controlplanes.yaml).
# No publicEndpoint: on port 443 the operator derives https://<hostname>.
#
# Upstream admits services.cinder only beside a message bus. The empty
# messaging block, in the patch of the service block, becomes the managed
# bus openstack-rabbitmq through the webhook, or stays the brownfield block
# of components/messaging-tls when the stage holds it, before or after this
# Component. The second patch has the Job controlplane-database-tenant wait
# for the block and write the database role of cinder.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: c5c3.io
      version: v1alpha1
      kind: ControlPlane
      name: controlplane
      namespace: openstack
    patch: |
      apiVersion: c5c3.io/v1alpha1
      kind: ControlPlane
      metadata:
        name: controlplane
        namespace: openstack
      spec:
        infrastructure:
          messaging: {}
        services:
          cinder:
            gateway:
              parentRef:
                name: openstack-gw
              hostname: cinder.${ADDRESSES_GATEWAY//./-}.nip.io
            backends: []
  - target:
      group: batch
      version: v1
      kind: Job
      name: controlplane-database-tenant
      namespace: openstack
    patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: controlplane-database-tenant
        namespace: openstack
      spec:
        template:
          spec:
            containers:
              - name: tenant
                env:
                  - name: TENANT_SERVICE_CINDER
                    value: cinder
