# Horizon behind the Gateway openstack-gw at horizon.<a-b-c-d>.nip.io. The
# block is that of Step 4 of upstream's Quick Start (ControlPlane) at the
# pin, as vendor/cobaltcore/deploy/overlays/kind/controlplane/controlplane.yaml
# carries it. Without secretKeyRef the webhook names the Secret
# horizon-secret-key, which the ExternalSecret of upstream's development
# base syncs from the path the bootstrap of the module openbao seeds.
# Horizon has no database, so the Job controlplane-database-tenant does not
# change.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../../vendor/cobaltcore/deploy/bases/devstack/infrastructure/horizon-secret-key-externalsecret.yaml
patches:
  - target:
      group: c5c3.io
      version: v1alpha1
      kind: ControlPlane
      name: controlplane
      namespace: openstack
    patch: |
      apiVersion: c5c3.io/v1alpha1
      kind: ControlPlane
      metadata:
        name: controlplane
        namespace: openstack
      spec:
        services:
          horizon:
            gateway:
              parentRef:
                name: openstack-gw
              hostname: horizon.${ADDRESSES_GATEWAY//./-}.nip.io
