apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    # Copies a chart out of the OCIRepository sandbox into an
    # ExternalArtifact, which a HelmRelease reads with spec.chartRef. With it
    # listed, the flux-operator turns on the feature gate ExternalArtifact of
    # helm-controller and kustomize-controller, off by default in Flux 2.10.
    - source-watcher
  cluster:
    type: kubernetes
    size: small
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=StrictPostBuildSubstitutions=true
