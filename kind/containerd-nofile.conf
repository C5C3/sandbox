# A drop-in of the containerd unit, which kind_config in scripts/lib/common.sh
# mounts into every node of the sandbox. The kind node image runs containerd
# with LimitNOFILE=infinity, which is fs.nr_open of the host, 1073741816 under
# current systemd, and every pod inherits that limit. uWSGI in Keystone sizes
# a table of its HTTP router by it and is OOMKilled at start within the memory
# of the sizing profile Minimal. Upstream caps the limit the same way on its
# own kind clusters (C5C3/cobaltcore#546); once its operators bound uWSGI
# themselves (C5C3/cobaltcore#1878), this file and its mount are deleted.
[Service]
LimitNOFILE=1048576
