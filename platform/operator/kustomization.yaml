# The c5c3-operator: upstream's release on one replica. Upstream names no
# service operator in its dependsOn, so the suspended keystone-operator does
# not hold it back (ADR-0021). Its hard dependency K-ORC is a Flux
# Kustomization of controllers, so the stage waits for management-controllers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../vendor/cobaltcore/deploy/bases/controlplane-operator
patches:
  # One replica, as
  # vendor/cobaltcore/deploy/bases/devstack/base/kustomization.yaml:311-329
  # sets on one node.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: c5c3-operator
      namespace: c5c3-system
    patch: |
      - op: replace
        path: /spec/values/replicas
        value: 1
