# The JSON schemas that make validate checks the kinds of the tree against,
# beside the schemas of Kubernetes. An entry has a name and exactly one of
# schemas, the https:// URL of a .tar.gz of JSON schemas, path, a glob of CRD
# files relative to the tree, and crds, the https:// URL of a YAML stream
# whose CustomResourceDefinitions are converted. A kind without a schema
# fails the validation, so the package that adds the first object of a kind
# adds its source here.
sources:
  # The version of the FluxInstance in flux/flux-instance.yaml.
  - name: flux
    schemas: https://github.com/fluxcd/flux2/releases/download/v2.10.0/crd-schemas.tar.gz
  # flux.operator of config.yaml.
  - name: flux-operator
    schemas: https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/v0.63.1/crd-schemas.tar.gz
  - name: cobaltcore
    path: vendor/cobaltcore/operators/*/config/crd/bases/*.yaml
  # The newest release of cert-manager in the chart range of
  # vendor/cobaltcore/deploy/bases/operators/releases/cert-manager.yaml.
  - name: cert-manager
    crds: https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.crds.yaml
  # The newest release of External Secrets in the chart range of
  # vendor/cobaltcore/deploy/bases/operators/releases/external-secrets.yaml.
  - name: external-secrets
    crds: https://raw.githubusercontent.com/external-secrets/external-secrets/v2.15.0/deploy/crds/bundle.yaml
  # The newest release of the garage-operator in the chart range of
  # vendor/cobaltcore/deploy/bases/operators/releases/garage-operator.yaml.
  - name: garage-operator
    crds: https://github.com/rajsinghtech/garage-operator/releases/download/v0.9.2/install.yaml
  # The resources of infrastructure/crds/kustomization.yaml.
  - name: gateway-api
    crds: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
  - name: envoy-gateway
    crds: https://github.com/envoyproxy/gateway/releases/download/v1.9.3/envoy-gateway-crds.yaml
  # The manifest of infrastructure/loadbalancer/kustomization.yaml.
  - name: metallb
    crds: https://raw.githubusercontent.com/metallb/metallb/v0.16.2/config/manifests/metallb-native.yaml
  # The tag of
  # vendor/cobaltcore/deploy/bases/operators/sources/rabbitmq-cluster-operator.yaml.
  - name: rabbitmq-cluster-operator
    crds: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.3/cluster-operator.yml
