# OpenBao reviews the token of a login on kubernetes/storage with that
# token itself, against the API of sandbox-storage, so the ServiceAccount
# of the PushSecrets may create TokenReviews there (ADR-0038).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ceph-keys-push-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ceph-keys-push
    namespace: rook-ceph
