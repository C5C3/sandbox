# The module rook-operator on sandbox-storage: the Rook operator, released
# from the hub. The storage cluster runs no Flux, so the source and the
# release live in flux-system of sandbox-management, and the release
# installs the chart on sandbox-storage through the Secret
# kubeconfig-storage. They are copies of upstream's files of
# deploy/overlays/metal-stack/ceph/ under names of their own, with one value
# more, allowLoopDevices (ADR-0035). The Namespace and the CRD of upstream's
# overlay are the module rook-crds, which this stage depends on.
# tests/unit/modules.bats compares each copy with upstream's file, so a move
# of the pin that changes one fails make test.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml
  - release.yaml
